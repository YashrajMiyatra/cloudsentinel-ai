<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Outline -->
  <path d="M50 8 L85 24 C85 60 50 88 50 92 C50 88 15 60 15 24 Z" 
        fill="#070b12" 
        stroke="url(#shieldGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />

  <!-- Inner Cyber Grid / Radar Arcs -->
  <path d="M50 20 L76 32 C76 56 50 78 50 82 C50 78 24 56 24 32 Z" 
        fill="url(#glowGrad)" 
        opacity="0.15" />

  <!-- AI Sentinel Core Ring -->
  <circle cx="50" cy="48" r="14" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6 3" filter="url(#glow)"/>
  
  <!-- Central Pulse Eye -->
  <circle cx="50" cy="48" r="7" fill="url(#shieldGrad)" />
  <circle cx="50" cy="48" r="3" fill="#ffffff" />

  <!-- Circuit nodes -->
  <line x1="50" y1="26" x2="50" y2="34" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="26" r="2" fill="#22d3ee"/>

  <line x1="50" y1="62" x2="50" y2="72" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="72" r="2" fill="#818cf8"/>

  <line x1="36" y1="48" x2="28" y2="48" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="48" r="2" fill="#22d3ee"/>

  <line x1="64" y1="48" x2="72" y2="48" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="72" cy="48" r="2" fill="#60a5fa"/>
</svg>